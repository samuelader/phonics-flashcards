<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Running stick figure -->
  <!-- Head -->
  <circle cx="120" cy="42" r="18" fill="#ffcc99" stroke="black" stroke-width="3"/>
  <!-- Face -->
  <circle cx="114" cy="39" r="2.5" fill="black"/>
  <circle cx="124" cy="39" r="2.5" fill="black"/>
  <path d="M113 48 Q120 54 127 48" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <line x1="120" y1="60" x2="108" y2="118" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <!-- Shirt -->
  <path d="M120 60 L108 118" stroke="#ee3311" stroke-width="4" stroke-linecap="round"/>
  <!-- Arms -->
  <!-- Back arm -->
  <line x1="116" y1="80" x2="145" y2="65" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <line x1="145" y1="65" x2="158" y2="75" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Forward arm -->
  <line x1="113" y1="88" x2="82" y2="75" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="75" x2="70" y2="88" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <!-- Forward leg -->
  <line x1="108" y1="118" x2="82" y2="150" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="150" x2="72" y2="175" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Back leg -->
  <line x1="108" y1="118" x2="130" y2="145" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="145" x2="148" y2="162" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="68" cy="176" rx="14" ry="7" fill="#221100" stroke="black" stroke-width="2.5"/>
  <ellipse cx="150" cy="165" rx="14" ry="7" fill="#221100" stroke="black" stroke-width="2.5" transform="rotate(30,150,165)"/>
  <!-- Speed lines -->
  <line x1="20" y1="80" x2="48" y2="82" stroke="#aaaaaa" stroke-width="3" stroke-linecap="round"/>
  <line x1="15" y1="96" x2="45" y2="96" stroke="#aaaaaa" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="112" x2="48" y2="110" stroke="#aaaaaa" stroke-width="3" stroke-linecap="round"/>
</svg>
