<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tin can body -->
  <rect x="55" y="68" width="90" height="108" fill="#bbbbcc" stroke="black" stroke-width="3"/>
  <!-- Top lid ellipse -->
  <ellipse cx="100" cy="68" rx="45" ry="12" fill="#ccccdd" stroke="black" stroke-width="3"/>
  <!-- Bottom ellipse -->
  <ellipse cx="100" cy="176" rx="45" ry="12" fill="#aaaabc" stroke="black" stroke-width="3"/>
  <!-- Label -->
  <rect x="57" y="92" width="86" height="60" fill="#ff5511" stroke="black" stroke-width="2"/>
  <!-- Label design lines -->
  <rect x="62" y="97" width="76" height="50" rx="3" fill="#ff4400" stroke="#ff6633" stroke-width="1.5"/>
  <line x1="65" y1="112" x2="135" y2="112" stroke="#ffaa88" stroke-width="2"/>
  <line x1="65" y1="122" x2="135" y2="122" stroke="#ffaa88" stroke-width="2"/>
  <line x1="65" y1="132" x2="110" y2="132" stroke="#ffaa88" stroke-width="2"/>
  <!-- Tin seam -->
  <line x1="55" y1="68" x2="55" y2="176" stroke="#999999" stroke-width="2"/>
  <!-- Rim ridge lines -->
  <line x1="55" y1="82" x2="145" y2="82" stroke="#aaaabc" stroke-width="3"/>
  <line x1="55" y1="160" x2="145" y2="160" stroke="#aaaabc" stroke-width="3"/>
  <!-- Shine -->
  <ellipse cx="72" cy="120" rx="5" ry="30" fill="white" opacity="0.25" transform="rotate(-5,72,120)"/>
</svg>
