<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="138" rx="52" ry="35" fill="#eeeecc" stroke="black" stroke-width="3"/>
  <!-- Neck -->
  <rect x="85" y="95" width="30" height="30" rx="8" fill="#eeeecc" stroke="black" stroke-width="3"/>
  <!-- Head -->
  <ellipse cx="100" cy="78" rx="28" ry="24" fill="#eeeecc" stroke="black" stroke-width="3"/>
  <!-- Horns -->
  <path d="M86 60 Q78 40 84 30" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M114 60 Q122 40 116 30" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="70" cy="75" rx="10" ry="16" fill="#eeeecc" stroke="black" stroke-width="2.5" transform="rotate(-20,70,75)"/>
  <ellipse cx="130" cy="75" rx="10" ry="16" fill="#eeeecc" stroke="black" stroke-width="2.5" transform="rotate(20,130,75)"/>
  <!-- Eye -->
  <ellipse cx="88" cy="74" rx="5" ry="6" fill="#886622" stroke="black" stroke-width="2"/>
  <ellipse cx="112" cy="74" rx="5" ry="6" fill="#886622" stroke="black" stroke-width="2"/>
  <rect x="86" y="72" width="4" height="4" rx="1" fill="black"/>
  <rect x="110" y="72" width="4" height="4" rx="1" fill="black"/>
  <!-- Nose / snout -->
  <ellipse cx="100" cy="90" rx="12" ry="8" fill="#ddddaa" stroke="black" stroke-width="2"/>
  <ellipse cx="96" cy="90" rx="3" ry="3.5" fill="#bb9988" stroke="black" stroke-width="1.5"/>
  <ellipse cx="104" cy="90" rx="3" ry="3.5" fill="#bb9988" stroke="black" stroke-width="1.5"/>
  <!-- Beard -->
  <path d="M95 98 Q100 112 95 118" fill="none" stroke="#ccccaa" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="66" y="165" width="15" height="28" rx="5" fill="#eeeecc" stroke="black" stroke-width="2.5"/>
  <rect x="88" y="165" width="15" height="28" rx="5" fill="#eeeecc" stroke="black" stroke-width="2.5"/>
  <rect x="97" y="165" width="15" height="28" rx="5" fill="#eeeecc" stroke="black" stroke-width="2.5"/>
  <rect x="119" y="165" width="15" height="28" rx="5" fill="#eeeecc" stroke="black" stroke-width="2.5"/>
  <!-- Hooves -->
  <rect x="66" y="188" width="15" height="7" rx="3" fill="#888866" stroke="black" stroke-width="2"/>
  <rect x="88" y="188" width="15" height="7" rx="3" fill="#888866" stroke="black" stroke-width="2"/>
  <rect x="97" y="188" width="15" height="7" rx="3" fill="#888866" stroke="black" stroke-width="2"/>
  <rect x="119" y="188" width="15" height="7" rx="3" fill="#888866" stroke="black" stroke-width="2"/>
  <!-- Tail -->
  <ellipse cx="152" cy="128" rx="8" ry="12" fill="white" stroke="black" stroke-width="2.5" transform="rotate(30,152,128)"/>
</svg>
