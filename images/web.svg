<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Spider web -->
  <!-- Radial threads -->
  <line x1="100" y1="100" x2="100" y2="20" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="155" y2="40" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="180" y2="100" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="155" y2="160" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="180" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="45" y2="160" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="20" y2="100" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="100" x2="45" y2="40" stroke="#cccccc" stroke-width="2"/>
  <!-- Spiral threads - ring 1 (small) -->
  <polygon points="100,72 123,81 131,107 115,128 85,128 69,107 77,81" fill="none" stroke="#cccccc" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ring 2 -->
  <polygon points="100,46 148,64 163,115 133,155 67,155 37,115 52,64" fill="none" stroke="#cccccc" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ring 3 (outer) -->
  <polygon points="100,24 164,50 185,118 150,165 50,165 15,118 36,50" fill="none" stroke="#bbbbbb" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Dew drops -->
  <circle cx="100" cy="46" r="4" fill="#aaddff" stroke="black" stroke-width="1.5"/>
  <circle cx="148" cy="64" r="3.5" fill="#aaddff" stroke="black" stroke-width="1.5"/>
  <circle cx="52" cy="64" r="3.5" fill="#aaddff" stroke="black" stroke-width="1.5"/>
  <!-- Spider -->
  <circle cx="100" cy="100" r="10" fill="#221100" stroke="black" stroke-width="2"/>
  <circle cx="100" cy="92" r="6" fill="#332200" stroke="black" stroke-width="2"/>
  <!-- Spider eyes -->
  <circle cx="97" cy="91" r="1.5" fill="#ff4400"/>
  <circle cx="103" cy="91" r="1.5" fill="#ff4400"/>
  <!-- Spider legs -->
  <line x1="92" y1="98" x2="75" y2="88" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="91" y1="103" x2="73" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="98" x2="125" y2="88" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="109" y1="103" x2="127" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
</svg>
