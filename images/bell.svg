<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bell body -->
  <path d="M100 45 Q60 55 50 100 Q45 135 40 155 L160 155 Q155 135 150 100 Q140 55 100 45 Z" fill="#ffcc00" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bell top knob -->
  <rect x="88" y="30" width="24" height="20" rx="8" fill="#ffcc00" stroke="black" stroke-width="3"/>
  <circle cx="100" cy="30" r="8" fill="#ffcc00" stroke="black" stroke-width="3"/>
  <!-- Bell rim -->
  <ellipse cx="100" cy="155" rx="60" ry="12" fill="#ffcc00" stroke="black" stroke-width="3"/>
  <!-- Clapper -->
  <line x1="100" y1="155" x2="100" y2="175" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="178" r="8" fill="#cc9900" stroke="black" stroke-width="3"/>
  <!-- Shine -->
  <ellipse cx="80" cy="90" rx="8" ry="18" fill="#ffe566" stroke="none" opacity="0.7"/>
</svg>
