<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="50" ry="42" fill="#ee4422" stroke="black" stroke-width="3"/>
  <!-- Wing -->
  <path d="M70 130 Q55 118 60 140 Q65 158 85 155 Z" fill="#cc3311" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tail feathers -->
  <path d="M148 128 Q168 110 172 90" fill="none" stroke="#cc3311" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 135 Q172 120 180 105" fill="none" stroke="#ee4422" stroke-width="7" stroke-linecap="round"/>
  <path d="M148 143 Q170 138 178 125" fill="none" stroke="#cc3311" stroke-width="7" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="84" y="88" width="28" height="32" rx="10" fill="#ee4422" stroke="black" stroke-width="3"/>
  <!-- Head -->
  <circle cx="98" cy="78" r="26" fill="#ee4422" stroke="black" stroke-width="3"/>
  <!-- Comb -->
  <path d="M88 52 Q84 38 90 30 Q94 42 98 35 Q102 45 106 38 Q110 50 108 58" fill="#ff2244" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Wattle -->
  <ellipse cx="92" cy="100" rx="8" ry="12" fill="#ff2244" stroke="black" stroke-width="2"/>
  <!-- Beak -->
  <polygon points="72,78 55,84 72,90" fill="#ffaa00" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="83" cy="72" r="7" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="83" cy="72" r="4" fill="#331100"/>
  <circle cx="81" cy="70" r="1.5" fill="white"/>
  <!-- Legs -->
  <line x1="82" y1="180" x2="78" y2="195" stroke="#ffaa00" stroke-width="5" stroke-linecap="round"/>
  <line x1="118" y1="180" x2="122" y2="195" stroke="#ffaa00" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet -->
  <path d="M78 195 L62 198 M78 195 L75 200 M78 195 L85 198" fill="none" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
  <path d="M122 195 L138 198 M122 195 L125 200 M122 195 L115 198" fill="none" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
</svg>
