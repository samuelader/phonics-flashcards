<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="145" rx="45" ry="38" fill="#ff9944" stroke="black" stroke-width="3"/>
  <!-- Head -->
  <circle cx="100" cy="88" r="36" fill="#ff9944" stroke="black" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="68,62 60,35 86,55" fill="#ff9944" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="132,62 140,35 114,55" fill="#ff9944" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner ears -->
  <polygon points="70,60 65,44 82,57" fill="#ffbbaa" stroke="none"/>
  <polygon points="130,60 135,44 118,57" fill="#ffbbaa" stroke="none"/>
  <!-- Eyes -->
  <ellipse cx="87" cy="84" rx="7" ry="8" fill="#66dd44" stroke="black" stroke-width="2"/>
  <ellipse cx="113" cy="84" rx="7" ry="8" fill="#66dd44" stroke="black" stroke-width="2"/>
  <ellipse cx="87" cy="84" rx="3" ry="7" fill="black"/>
  <ellipse cx="113" cy="84" rx="3" ry="7" fill="black"/>
  <!-- Nose -->
  <polygon points="100,96 95,102 105,102" fill="#ff6699" stroke="black" stroke-width="1.5"/>
  <!-- Mouth -->
  <path d="M95,102 Q100,108 105,102" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="62" y1="96" x2="90" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="102" x2="90" y2="103" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="108" x2="90" y2="106" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="96" x2="110" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="102" x2="110" y2="103" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="108" x2="110" y2="106" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M145,155 Q175,140 170,115 Q165,100 155,108" fill="none" stroke="#ff9944" stroke-width="10" stroke-linecap="round"/>
  <path d="M145,155 Q175,140 170,115 Q165,100 155,108" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="78" cy="178" rx="16" ry="10" fill="#ff9944" stroke="black" stroke-width="2.5"/>
  <ellipse cx="122" cy="178" rx="16" ry="10" fill="#ff9944" stroke="black" stroke-width="2.5"/>
</svg>
