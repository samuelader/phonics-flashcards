  <circle cx="100" cy="18" r="10" fill="#ffcc00" stroke="black" stroke-width="3"/>
  <!-- Tip -->
  <circle cx="100" cy="188" r="5" fill="#221100" stroke="black" stroke-width="2"/>
  <!-- Spin lines -->
