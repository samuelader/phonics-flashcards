  <path d="M65 75 Q100 80 135 75" fill="none" stroke="#ffdd00" stroke-width="6" stroke-linecap="round"/>
  <path d="M52 100 Q100 108 148 100" fill="none" stroke="#ffdd00" stroke-width="6" stroke-linecap="round"/>
  <!-- Stripe on lower cone -->
  <path d="M80 148 Q100 152 120 148" fill="none" stroke="#ffdd00" stroke-width="5" stroke-linecap="round"/>
  <!-- Top handle/knob -->
