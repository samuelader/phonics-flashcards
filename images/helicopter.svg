<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tail boom -->
  <path d="M120 110 L185 90 L185 102 L125 122 Z" fill="#3a7bd5" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tail rotor -->
  <line x1="183" y1="78" x2="183" y2="112" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <circle cx="183" cy="95" r="5" fill="#ffd633" stroke="black" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="85" cy="115" rx="52" ry="38" fill="#e23b3b" stroke="black" stroke-width="3"/>
  <!-- Window -->
  <path d="M50 100 Q42 118 58 132 Q78 134 84 110 Z" fill="#aee3ff" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Skids -->
  <line x1="55" y1="160" x2="130" y2="160" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="150" x2="68" y2="160" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="150" x2="115" y2="160" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- Mast -->
  <rect x="82" y="62" width="8" height="18" rx="3" fill="#ffd633" stroke="black" stroke-width="2.5"/>
  <!-- Main rotor -->
  <line x1="25" y1="62" x2="150" y2="62" stroke="#3a7bd5" stroke-width="7" stroke-linecap="round"/>
  <line x1="25" y1="62" x2="150" y2="62" stroke="black" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="62" r="6" fill="#ffd633" stroke="black" stroke-width="2.5"/>
</svg>
