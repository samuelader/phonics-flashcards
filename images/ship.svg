  <circle cx="112" cy="38" r="8" fill="#aaaaaa" stroke="black" stroke-width="2" opacity="0.7"/>
  <circle cx="95" cy="30" r="7" fill="#cccccc" stroke="black" stroke-width="2" opacity="0.6"/>
