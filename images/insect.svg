<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ladybird / ladybug -->
  <!-- Body (two wing cases) -->
  <ellipse cx="100" cy="120" rx="52" ry="55" fill="#ee2211" stroke="black" stroke-width="3"/>
  <!-- Centre line -->
  <line x1="100" y1="65" x2="100" y2="175" stroke="black" stroke-width="3"/>
  <!-- Spots -->
  <circle cx="78" cy="100" r="12" fill="black"/>
  <circle cx="122" cy="100" r="12" fill="black"/>
  <circle cx="75" cy="130" r="10" fill="black"/>
  <circle cx="125" cy="130" r="10" fill="black"/>
  <circle cx="82" cy="158" r="9" fill="black"/>
  <circle cx="118" cy="158" r="9" fill="black"/>
  <!-- Head -->
  <circle cx="100" cy="65" r="22" fill="black" stroke="black" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="90" cy="60" r="7" fill="white"/>
  <circle cx="110" cy="60" r="7" fill="white"/>
  <circle cx="90" cy="60" r="3.5" fill="black"/>
  <circle cx="110" cy="60" r="3.5" fill="black"/>
  <circle cx="88" cy="58" r="1.5" fill="white"/>
  <circle cx="108" cy="58" r="1.5" fill="white"/>
  <!-- Antennae -->
  <path d="M90 44 Q82 28 76 22" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110 44 Q118 28 124 22" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="76" cy="22" r="4" fill="black"/>
  <circle cx="124" cy="22" r="4" fill="black"/>
  <!-- Legs -->
  <line x1="60" y1="110" x2="38" y2="102" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="125" x2="36" y2="122" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="140" x2="40" y2="145" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="110" x2="162" y2="102" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="125" x2="164" y2="122" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="138" y1="140" x2="160" y2="145" stroke="black" stroke-width="3" stroke-linecap="round"/>
</svg>
