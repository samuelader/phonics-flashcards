<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bed frame -->
  <rect x="20" y="120" width="160" height="50" rx="6" fill="#c8860a" stroke="black" stroke-width="3"/>
  <!-- Headboard -->
  <rect x="20" y="80" width="30" height="92" rx="8" fill="#c8860a" stroke="black" stroke-width="3"/>
  <!-- Footboard -->
  <rect x="150" y="100" width="30" height="72" rx="8" fill="#c8860a" stroke="black" stroke-width="3"/>
  <!-- Mattress -->
  <rect x="48" y="108" width="104" height="28" rx="6" fill="#f5f0e0" stroke="black" stroke-width="3"/>
  <!-- Pillow -->
  <rect x="54" y="110" width="36" height="22" rx="8" fill="white" stroke="black" stroke-width="2.5"/>
  <!-- Blanket -->
  <rect x="48" y="120" width="104" height="20" rx="5" fill="#ee4466" stroke="black" stroke-width="3"/>
  <!-- Blanket stripes -->
  <line x1="48" y1="128" x2="152" y2="128" stroke="#cc2244" stroke-width="2"/>
  <!-- Legs -->
  <rect x="24" y="165" width="12" height="20" rx="3" fill="#a06008" stroke="black" stroke-width="2.5"/>
  <rect x="164" y="165" width="12" height="20" rx="3" fill="#a06008" stroke="black" stroke-width="2.5"/>
</svg>
