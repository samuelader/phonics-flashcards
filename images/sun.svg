  <line x1="157" y1="43" x2="165" y2="35" stroke="#ffcc00" stroke-width="6" stroke-linecap="round"/>
  <line x1="43" y1="157" x2="35" y2="165" stroke="#ffcc00" stroke-width="6" stroke-linecap="round"/>
