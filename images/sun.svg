  <line x1="28" y1="68" x2="18" y2="62" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="172" y1="68" x2="182" y2="62" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="132" x2="18" y2="138" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="172" y1="132" x2="182" y2="138" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="172" x2="62" y2="182" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
