<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Wings -->
  <path d="M100 110 Q60 70 20 60 Q40 90 50 115 Z" fill="#5533aa" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100 110 Q140 70 180 60 Q160 90 150 115 Z" fill="#5533aa" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing inner lines -->
  <path d="M100 110 Q75 85 45 75" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 110 Q125 85 155 75" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="22" ry="30" fill="#5533aa" stroke="black" stroke-width="3"/>
  <!-- Head -->
  <circle cx="100" cy="90" r="22" fill="#5533aa" stroke="black" stroke-width="3"/>
  <!-- Ears -->
  <polygon points="82,72 74,50 92,65" fill="#5533aa" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="118,72 126,50 108,65" fill="#5533aa" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="92" cy="88" r="5" fill="red" stroke="black" stroke-width="2"/>
  <circle cx="108" cy="88" r="5" fill="red" stroke="black" stroke-width="2"/>
  <circle cx="92" cy="88" r="2" fill="black"/>
  <circle cx="108" cy="88" r="2" fill="black"/>
  <!-- Fangs -->
  <polygon points="96,102 93,112 99,112" fill="white" stroke="black" stroke-width="1.5"/>
  <polygon points="104,102 101,112 107,112" fill="white" stroke="black" stroke-width="1.5"/>
</svg>
