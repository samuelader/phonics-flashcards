<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Leg -->
  <path d="M100 140 L100 165 L92 190" fill="none" stroke="#ff8fb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 190 L82 190 M92 190 L102 190" fill="none" stroke="#ff8fb0" stroke-width="4" stroke-linecap="round"/>
  <!-- Tucked leg -->
  <path d="M108 138 L118 152 L110 158" fill="none" stroke="#ff8fb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="42" ry="32" fill="#ff66a3" stroke="black" stroke-width="3"/>
  <!-- Wing -->
  <path d="M80 110 Q110 100 135 122 Q110 130 88 126 Z" fill="#ff85b8" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tail -->
  <path d="M138 110 Q158 100 152 122" fill="#ff66a3" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Neck (curved S) -->
  <path d="M85 100 Q60 80 75 55 Q85 40 100 45" fill="none" stroke="#ff66a3" stroke-width="12" stroke-linecap="round"/>
  <path d="M85 100 Q60 80 75 55 Q85 40 100 45" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="98" cy="44" r="14" fill="#ff66a3" stroke="black" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="100" cy="40" r="3.5" fill="black"/>
  <!-- Beak -->
  <path d="M108 46 Q124 48 122 60 Q114 58 106 52 Z" fill="#ffb84d" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M106 52 L122 60" stroke="black" stroke-width="2"/>
</svg>
